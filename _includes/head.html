<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  {%- seo -%}
  <link rel="icon" href="{{ "/assets/images/favicon.ico" | relative_url }}" sizes="any">
  <link rel="icon" href="{{ "/assets/images/favicon.svg" | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ "/assets/images/favicon-96x96.png" | relative_url }}" type="image/png" sizes="96x96">
  <link rel="apple-touch-icon" href="{{ "/assets/images/apple-touch-icon.png" | relative_url }}">
  <link rel="manifest" href="{{ "/assets/images/site.webmanifest" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ "/" | relative_url }}">
        <img src="{{ "/assets/images/koykka_logo.svg" | relative_url }}" alt="{{ site.title }}" class="brand-logo">
      </a>
      <nav class="nav">
        {%- for item in site.navbar -%}
          <a href="{{ item.url | relative_url }}">{{ item.title }}</a>
        {%- endfor -%}
      </nav>
    </div>
  </header>
