title: "Koykka Photography"
description: "Minimal static site for koykka.ca"
url: "https://koykka.ca"
baseurl: ""  # leave empty for apex domain

plugins:
  - jekyll-feed
  - jekyll-seo-tag

defaults:
  - scope:
      path: "portrait"
    values:
      body_class: page-photo-detail
      main_class: photo-detail
      content_wrapper_class: photo-detail-flow
  - scope:
      path: "food"
    values:
      body_class: page-photo-detail
      main_class: photo-detail
      content_wrapper_class: photo-detail-flow

# Simple navbar config
navbar:
  - title: About Me
    url: /about/
  - title: Portrait
    url: /portrait/
  - title: Food
    url: /food/
  - title: Contact
    url: /contact/

# Build settings
markdown: kramdown
exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - Makefile.mak
