title: "Koykka Photography"
description: "Minimal static site for koykka.ca"
url: "https://koykka.ca"
baseurl: ""  # leave empty for apex domain

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Simple navbar config
navbar:
  - title: Home
    url: /
  - title: About Me
    url: /about/
  - title: Portrait
    url: /portrait/
  - title: Food
    url: /food/
  - title: Contact
    url: /contact/

# Build settings
markdown: kramdown
exclude:
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - Makefile.mak
